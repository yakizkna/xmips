; ============================================================
; Xmips 系统配置文件
; 格式: key=value（无空格），每行一个参数，以 end 或 END 结尾
; 以 ; 开头的行为注释行；参数值后可跟 ; 行内注释
; ============================================================

; ----- 运行模式 -----
delayMode=0       ; 延时模式: 0=不延时, 1=延时（模拟指令执行时序）
displayMode=2     ; 显示模式: 0=隐藏进程加载内容, 1=显示全部信息, 2=只显示标准输出和系统错误
reportLevel=0     ; 报告级别: 0=只报告 Warning 和 Error, 1=报告 Normal 和 Error, 2=报告全部

; ----- 系统函数 -----
updateSysfun=1    ; 系统函数更新: 0=使用已汇编的机器码, 1=重新汇编 sysfun/ 下的 INT_xx.scp

; ----- 用户进程内存大小（单位: int整型） -----
codeSize=8000      ; 代码区长度（MD5 展开程序较大）
dataSize=2000      ; 数据区长度
stackSize=200      ; 栈区长度

; ----- 系统函数内存大小（单位: int整型） -----
sysfunCodeSize=1000   ; 系统函数代码区长度
sysfunDataSize=1000    ; 系统函数数据区长度（运行时指向调用者的数据段）
sysfunStackSize=100   ; 系统函数栈区长度

; ----- 调度 -----
cycleTimes=30     ; 时间片大小: 每个时间片最多执行的指令数
pcbNum=10         ; PCB 数量: 系统最大并发进程数

; ----- 机器字长 -----
bitMode=32        ; 机器字长: 32=32位整数(溢出回绕), 64=64位整数（MD5 计算器需 32）

; ----- 文件系统 / 网络 -----
diskRoot=disk     ; 预留配置项。文件 open 直接读写真实宿主文件（相对 cwd 或绝对路径），不再限定于 disk/ 目录
sockTimeout=2000  ; socket connect/write 超时（毫秒）

; ----- 调试 -----
dump=0            ; 指令执行 dump 日志: 0=关闭, 1=开启（把每步有变化的寄存器与内存写入运行目录 log/dump.log）

end
